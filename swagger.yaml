openapi: 3.0.0
info:
  title: FilmReview API
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
paths:
  /auth/register:
    post:
      summary: Registrar novo usuário
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: usuario123
                password:
                  type: string
                  example: senhaSegura
              required:
                - username
                - password
        required: true
      responses:
        '201':
          description: Usuário criado com sucesso
        '400':
          description: Erro na validação
  /auth/login:
    post:
      summary: Login do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: usuario123
                password:
                  type: string
                  example: senhaSegura
              required:
                - username
                - password
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Credenciais inválidas
  /movies:
    get:
      summary: Buscar filmes pelo nome
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          example: Matrix
          description: Nome do filme para busca
      responses:
        '200':
          description: Lista de filmes e contagem de reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Matrix
                    photo:
                      type: string
                      example: photo-1234.jpg
                    reviewCount:
                      type: integer
                      example: 5
        '400':
          description: Parâmetro name obrigatório
    post:
      summary: Criar novo filme
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Matrix
                photo:
                  type: string
                  format: binary
              required:
                - name
                - photo
      responses:
        '201':
          description: Filme criado com sucesso
        '400':
          description: Erro na validação
  /reviews:
    get:
      summary: Buscar reviews pelo ID do filme
      parameters:
        - in: query
          name: movieId
          required: true
          schema:
            type: integer
          example: 1
          description: ID do filme
      responses:
        '200':
          description: Lista de reviews do filme
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 100
                    username:
                      type: string
                      example: usuario123
                    rating:
                      type: number
                      format: float
                      example: 4.5
                    reviewText:
                      type: string
                      example: Filme muito bom e emocionante.
                    createdAt:
                      type: string
                      format: date-time
                      example: '2024-06-01T12:34:56Z'
        '400':
          description: Parâmetro movieId obrigatório
    post:
      summary: Criar nova review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  example: 10
                movieId:
                  type: integer
                  example: 1
                rating:
                  type: number
                  example: 4.5
                reviewText:
                  type: string
                  example: Excelente filme, recomendo.
              required:
                - userId
                - movieId
                - rating
                - reviewText
      responses:
        '201':
          description: Review criada com sucesso
        '400':
          description: Erro na validação
